<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matrix AI</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#0e0e10;color:#e1e1e6;font-family:Inter,Segoe UI,Arial,sans-serif;display:flex;justify-content:center;align-items:center}
.app{width:100%;max-width:800px;height:100%;max-height:100vh;display:flex;flex-direction:column;background:#0e0e10;position:relative;overflow:hidden}
.top{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #222226;background:#121216}
.brand{font-size:15px;font-weight:600;color:#f1f1f3;display:flex;align-items:center;gap:8px}
.brand span{font-size:12px;color:#71717a;font-weight:400}
.actions{display:flex;gap:8px}
.icon{width:34px;height:34px;border:1px solid #2a2a30;background:#18181c;color:#a1a1aa;border-radius:8px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.icon:hover{background:#25252b;color:#f1f1f3;border-color:#3f3f46}
.messages{flex:1;overflow-y:auto;padding:24px 20px;scroll-behavior:smooth;display:flex;flex-direction:column;gap:20px}
.empty{margin:auto;text-align:center;max-width:360px;padding:0 20px}
.empty h1{font-size:22px;font-weight:600;color:#f4f4f5;margin:0 0 8px}
.empty p{font-size:13px;color:#71717a;margin:0;line-height:1.5}
.row{display:flex;width:100%}
.row.user{justify-content:flex-end}
.row.assistant{justify-content:flex-start}
.bubble{max-width:85%;padding:12px 16px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.user .bubble{background:#27272a;color:#f4f4f5;border-radius:16px 16px 4px 16px;border:1px solid #3f3f46}
.assistant .bubble{background:transparent;color:#d4d4d8;border-radius:16px 16px 16px 4px;padding:4px 0}
.composer-wrap{padding:16px 20px 24px;background:linear-gradient(to top, #0e0e10 80%, rgba(14,14,16,0))}
.composer{display:flex;align-items:flex-end;gap:10px;border:1px solid #2a2a30;background:#18181c;border-radius:14px;padding:10px 14px;box-shadow:0 4px 20px rgba(0,0,0,0.3);transition:border-color 0.2s}
.composer:focus-within{border-color:#52525b}
.composer textarea{flex:1;resize:none;min-height:24px;max-height:140px;border:0;outline:0;background:transparent;color:#f4f4f5;font:14px/1.5 inherit;padding:2px 0}
.composer textarea::placeholder{color:#71717a}
.send{width:36px;height:36px;border:0;border-radius:10px;background:#f4f4f5;color:#18181c;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:background 0.2s}
.send:hover{background:#ffffff}
.send:disabled{opacity:0.3;cursor:default}
.status{text-align:center;font-size:11px;color:#71717a;margin-top:8px;min-height:14px}

/* Auth Screens */
.auth-wrapper{display:flex;align-items:center;justify-content:center;height:100%;width:100%}
.auth-container{width:100%;max-width:380px;padding:32px;background:#141418;border:1px solid #222226;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,0.5)}
.auth-container h2{margin:0 0 6px;color:#f4f4f5;font-size:20px;font-weight:600}
.auth-subtitle{color:#71717a;font-size:13px;margin-bottom:24px}
.auth-container label{display:block;font-size:12px;color:#a1a1aa;margin-bottom:6px;font-weight:500}
.auth-container input{width:100%;padding:11px 14px;margin-bottom:16px;background:#0e0e10;border:1px solid #2a2a30;border-radius:10px;color:#f4f4f5;font-size:14px;outline:none;transition:border-color 0.2s}
.auth-container input:focus{border-color:#71717a}
.auth-container button{width:100%;padding:12px;margin-top:8px;background:#f4f4f5;border:0;border-radius:10px;font-weight:600;font-size:14px;color:#18181c;cursor:pointer;transition:background 0.2s}
.auth-container button:hover{background:#ffffff}
.auth-switch{margin-top:18px;text-align:center;font-size:13px;color:#71717a;cursor:pointer}
.auth-switch span{color:#f4f4f5;font-weight:500}
.auth-switch span:hover{text-decoration:underline}

@media(max-width:600px){
  .app{max-height:100vh;height:100vh}
  .messages{padding:16px 12px}
  .composer-wrap{padding:12px 12px 16px}
}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const app=document.getElementById('app');
let authToken=localStorage.getItem('matrix_token')||null;
let currentUsername=localStorage.getItem('matrix_user')||null;
let history=[],busy=false;

function renderAuth(isRegister=false){
  app.innerHTML=`
    <div class="auth-wrapper">
      <div class="auth-container">
        <h2>${isRegister?'Create an account':'Welcome back'}</h2>
        <div class="auth-subtitle">${isRegister?'Sign up to save your chat history':'Sign in to continue to Matrix'}</div>
        <label>Username</label>
        <input type="text" id="username" placeholder="Enter your username">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password">
        <button id="authBtn">${isRegister?'Sign Up':'Sign In'}</button>
        <div class="auth-switch" id="switchBtn">
          ${isRegister?'Already have an account? <span>Sign In</span>':'Need an account? <span>Sign Up</span>'}
        </div>
      </div>
    </div>
  `;

  document.getElementById('authBtn').onclick=async()=>{
    const u=document.getElementById('username').value.trim();
    const p=document.getElementById('password').value.trim();
    if(!u||!p)return alert('Please fill in all fields');

    const endpoint=isRegister?'/api/auth/register':'/api/auth/login';
    try{
      const res=await fetch(endpoint,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({username:u,password:p})
      });
      const data=await res.json();
      if(!res.ok)throw new Error(data.error||'Authentication failed');

      if(isRegister){
        alert('Registered successfully! Please sign in.');
        renderAuth(false);
      }else{
        localStorage.setItem('matrix_token',data.token);
        localStorage.setItem('matrix_user',data.username);
        authToken=data.token;
        currentUsername=data.username;
        renderChatApp();
      }
    }catch(err){alert(err.message);}
  };

  document.getElementById('switchBtn').onclick=()=>renderAuth(!isRegister);
}

function renderChatApp(){
  app.innerHTML=`
    <header class="top">
      <div class="brand">Matrix <span>@${currentUsername}</span></div>
      <div class="actions">
        <button class="icon" id="logoutBtn" title="Logout">⎋</button>
        <button class="icon" id="minBtn" title="Minimize">—</button>
        <button class="icon" id="closeBtn" title="Close">×</button>
      </div>
    </header>
    <main class="messages" id="messages">
      <div class="empty" id="empty">
        <div><h1>What can I help with?</h1><p>Ask Matrix anything and your conversation history will be saved securely.</p></div>
      </div>
    </main>
    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Message Matrix..."></textarea>
        <button class="send" id="send" title="Send">↑</button>
      </div>
      <div class="status" id="status"></div>
    </div>
  `;

  const messagesEl=document.getElementById('messages'),
        input=document.getElementById('input'),
        send=document.getElementById('send'),
        statusEl=document.getElementById('status'),
        empty=document.getElementById('empty');

  document.getElementById('logoutBtn').onclick=()=>{
    if(confirm('Are you sure you want to log out?')){
      localStorage.removeItem('matrix_token');
      localStorage.removeItem('matrix_user');
      authToken=null;
      currentUsername=null;
      history=[];
      renderAuth();
    }
  };

  document.getElementById('minBtn').onclick=()=>{
    const content = app.querySelectorAll('.messages, .composer-wrap');
    const isHidden = content[0].style.display === 'none';
    content.forEach(el => el.style.display = isHidden ? '' : 'none');
  };

  document.getElementById('closeBtn').onclick=()=>{
    app.innerHTML='<div style="margin:auto;color:#71717a;font:14px Inter,sans-serif">Matrix session closed. Refresh to restart.</div>';
  };

  function addMessage(role,text){
    if(empty && empty.parentNode) empty.remove();
    const row=document.createElement('div'); row.className='row '+role;
    const bubble=document.createElement('div'); bubble.className='bubble'; bubble.textContent=text; 
    row.appendChild(bubble); messagesEl.appendChild(row); 
    messagesEl.scrollTop=messagesEl.scrollHeight; 
    return bubble;
  }

  function setStatus(t){statusEl.textContent=t||''}

  async function loadHistory(){
    try{
      const res=await fetch('/api/history',{
        headers:{'Authorization':`Bearer ${authToken}`}
      });
      if(res.ok){
        const dbMessages=await res.json();
        dbMessages.forEach(m=>{
          history.push({role:m.role,content:m.content});
          addMessage(m.role,m.content);
        });
      }
    }catch(e){console.error('Failed to load history',e);}
  }
  loadHistory();

  async function ask(){
    const text=input.value.trim(); if(!text||busy)return;
    busy=true;send.disabled=true;input.value='';resize();setStatus('Thinking…');
    addMessage('user',text);history.push({role:'user',content:text});
    const bubble=addMessage('assistant','');
    try{
      const r=await fetch('/api/chat',{
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'Authorization':`Bearer ${authToken}`
        },
        body:JSON.stringify({messages:history})
      });
      const data=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(data.error||'Request failed');
      const answer=data.content||'I could not generate a response.';
      bubble.textContent=answer;history.push({role:'assistant',content:answer});
    }catch(e){
      bubble.textContent='Sorry, I could not reach the AI service right now.';
      console.error(e);
    }finally{
      busy=false;send.disabled=false;setStatus('');input.focus();messagesEl.scrollTop=messagesEl.scrollHeight;
    }
  }

  function resize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,140)+'px'}
  input.addEventListener('input',resize);
  input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});
  send.addEventListener('click',ask);
  input.focus();
}

if(!authToken){
  renderAuth();
}else{
  renderChatApp();
}
</script>
</body>
</html>
