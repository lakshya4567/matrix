<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matrix AI</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#0e0e10;color:#e1e1e6;font-family:Inter,Segoe UI,Arial,sans-serif;display:flex;justify-content:center;align-items:center;overflow:hidden}
.app{width:100%;max-width:900px;height:100%;max-height:100vh;display:flex;background:#0e0e10;position:relative}
.sidebar{width:260px;background:#121216;border-right:1px solid #222226;display:flex;flex-direction:column;transition:transform 0.3s ease;z-index:10}
.sidebar.hidden{transform:translateX(-100%);position:absolute;height:100%}
.sidebar-header{padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222226}
.new-chat-btn{width:100%;padding:10px;background:#27272a;border:1px solid #3f3f46;color:#f4f4f5;border-radius:8px;cursor:pointer;font-weight:500;font-size:13px;margin:12px 0 0;text-align:left;display:flex;align-items:center;gap:8px}
.new-chat-btn:hover{background:#3f3f46}
.chat-list{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:4px}
.chat-item{padding:10px 12px;border-radius:6px;cursor:pointer;font-size:13px;color:#a1a1aa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item:hover{background:#18181c;color:#f4f4f5}
.chat-item.active{background:#27272a;color:#f4f4f5}

.main-content{flex:1;display:flex;flex-direction:column;height:100%;background:#0e0e10;position:relative}
.top{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #222226;background:#121216}
.brand{font-size:15px;font-weight:600;color:#f1f1f3;display:flex;align-items:center;gap:12px}
.brand span{font-size:12px;color:#71717a;font-weight:400}
.actions{display:flex;gap:8px}
.icon{width:34px;height:34px;border:1px solid #2a2a30;background:#18181c;color:#a1a1aa;border-radius:8px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.icon:hover{background:#25252b;color:#f1f1f3;border-color:#3f3f46}
.messages{flex:1;overflow-y:auto;padding:24px 20px;scroll-behavior:smooth;display:flex;flex-direction:column;gap:20px}
.empty{margin:auto;text-align:center;max-width:360px;padding:0 20px}
.empty h1{font-size:22px;font-weight:600;color:#f4f4f5;margin:0 0 8px}
.empty p{font-size:13px;color:#71717a;margin:0;line-height:1.5}
.row{display:flex;width:100%}
.row.user{justify-content:flex-end}
.row.assistant{justify-content:flex-start}
.bubble{max-width:85%;padding:12px 16px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.user .bubble{background:#27272a;color:#f4f4f5;border-radius:16px 16px 4px 16px;border:1px solid #3f3f46}
.assistant .bubble{background:transparent;color:#d4d4d8;border-radius:16px 16px 16px 4px;padding:4px 0}
.composer-wrap{padding:16px 20px 24px;background:linear-gradient(to top, #0e0e10 80%, rgba(14,14,16,0))}
.composer{display:flex;align-items:flex-end;gap:10px;border:1px solid #2a2a30;background:#18181c;border-radius:14px;padding:10px 14px;box-shadow:0 4px 20px rgba(0,0,0,0.3)}
.composer:focus-within{border-color:#52525b}
.composer textarea{flex:1;resize:none;min-height:24px;max-height:140px;border:0;outline:0;background:transparent;color:#f4f4f5;font:14px/1.5 inherit;padding:2px 0}
.composer textarea::placeholder{color:#71717a}
.send{width:36px;height:36px;border:0;border-radius:10px;background:#f4f4f5;color:#18181c;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
.send:hover{background:#ffffff}
.send:disabled{opacity:0.3;cursor:default}
.status{text-align:center;font-size:11px;color:#71717a;margin-top:8px;min-height:14px}

/* Auth Screens */
.auth-wrapper{display:flex;align-items:center;justify-content:center;height:100%;width:100%}
.auth-container{width:100%;max-width:380px;padding:32px;background:#141418;border:1px solid #222226;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,0.5)}
.auth-container h2{margin:0 0 6px;color:#f4f4f5;font-size:20px;font-weight:600}
.auth-subtitle{color:#71717a;font-size:13px;margin-bottom:24px}
.auth-container label{display:block;font-size:12px;color:#a1a1aa;margin-bottom:6px;font-weight:500}
.auth-container input{width:100%;padding:11px 14px;margin-bottom:16px;background:#0e0e10;border:1px solid #2a2a30;border-radius:10px;color:#f4f4f5;font-size:14px;outline:none}
.auth-container button{width:100%;padding:12px;margin-top:8px;background:#f4f4f5;border:0;border-radius:10px;font-weight:600;font-size:14px;color:#18181c;cursor:pointer}
.auth-switch{margin-top:18px;text-align:center;font-size:13px;color:#71717a;cursor:pointer}
.auth-switch span{color:#f4f4f5;font-weight:500}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const app=document.getElementById('app');
let authToken=localStorage.getItem('matrix_token')||null;
let currentUsername=localStorage.getItem('matrix_user')||null;
let currentChatId=null;
let chats=[];
let history=[];
let busy=false;

function renderAuth(isRegister=false){
  app.innerHTML=`
    <div class="auth-wrapper">
      <div class="auth-container">
        <h2>${isRegister?'Create an account':'Welcome back'}</h2>
        <div class="auth-subtitle">${isRegister?'Sign up to save chat history':'Sign in to continue to Matrix'}</div>
        <label>Username</label>
        <input type="text" id="username" placeholder="Username">
        <label>Password</label>
        <input type="password" id="password" placeholder="Password">
        <button id="authBtn">${isRegister?'Sign Up':'Sign In'}</button>
        <div class="auth-switch" id="switchBtn">
          ${isRegister?'Already have an account? <span>Sign In</span>':'Need an account? <span>Sign Up</span>'}
        </div>
      </div>
    </div>
  `;

  document.getElementById('authBtn').onclick=async()=>{
    const u=document.getElementById('username').value.trim();
    const p=document.getElementById('password').value.trim();
    if(!u||!p)return alert('Fill all fields');

    const endpoint=isRegister?'/api/auth/register':'/api/auth/login';
    try{
      const res=await fetch(endpoint,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({username:u,password:p})
      });
      const data=await res.json();
      if(!res.ok)throw new Error(data.error||'Auth failed');

      if(isRegister){
        alert('Registered successfully! Please sign in.');
        renderAuth(false);
      }else{
        localStorage.setItem('matrix_token',data.token);
        localStorage.setItem('matrix_user',data.username);
        authToken=data.token;
        currentUsername=data.username;
        initApp();
      }
    }catch(err){alert(err.message);}
  };
  document.getElementById('switchBtn').onclick=()=>renderAuth(!isRegister);
}

async function initApp(){
  app.innerHTML=`
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span style="font-weight:600;font-size:14px;color:#f4f4f5">Chats</span>
        <button class="icon" id="closeSidebarBtn" title="Close Sidebar">✕</button>
      </div>
      <div style="padding: 0 12px;">
        <button class="new-chat-btn" id="newChatBtn">＋ New Chat</button>
      </div>
      <div class="chat-list" id="chatList"></div>
    </div>
    <div class="main-content">
      <header class="top">
        <div class="brand">
          <button class="icon" id="toggleSidebarBtn" title="Toggle Sidebar">≡</button>
          Matrix <span>@${currentUsername}</span>
        </div>
        <div class="actions">
          <button class="icon" id="logoutBtn" title="Logout">⎋</button>
        </div>
      </header>
      <main class="messages" id="messages">
        <div class="empty" id="empty">
          <div><h1>What can I help with?</h1><p>Ask Matrix anything.</p></div>
        </div>
      </main>
      <div class="composer-wrap">
        <div class="composer">
          <textarea id="input" rows="1" placeholder="Message Matrix..."></textarea>
          <button class="send" id="send" title="Send">↑</button>
        </div>
        <div class="status" id="status"></div>
      </div>
    </div>
  `;

  document.getElementById('toggleSidebarBtn').onclick = () => {
    document.getElementById('sidebar').classList.toggle('hidden');
  };
  document.getElementById('closeSidebarBtn').onclick = () => {
    document.getElementById('sidebar').classList.add('hidden');
  };
  document.getElementById('logoutBtn').onclick = () => {
    localStorage.clear();
    authToken = null;
    renderAuth();
  };
  document.getElementById('newChatBtn').onclick = () => createNewChat(true);

  await loadChats();
}

async function loadChats(){
  try{
    const res = await fetch('/api/chats', { headers: { 'Authorization': `Bearer ${authToken}` } });
    if(res.ok){
      chats = await res.json();
      if(chats.length > 0){
        selectChat(chats[0]._id);
      } else {
        createNewChat(false);
      }
    }
  }catch(e){console.error(e);}
}

async function createNewChat(selectIt=true){
  try{
    const res = await fetch('/api/chats', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${authToken}` }
    });
    if(res.ok){
      const newChat = await res.json();
      chats.unshift(newChat);
      renderChatList();
      if(selectIt) selectChat(newChat._id);
    }
  }catch(e){console.error(e);}
}

function renderChatList(){
  const listEl = document.getElementById('chatList');
  if(!listEl) return;
  listEl.innerHTML = chats.map(c => `
    <div class="chat-item ${c._id===currentChatId?'active':''}" onclick="selectChat('${c._id}')">
      ${escapeHtml(c.title)}
    </div>
  `).join('');
}

async function selectChat(chatId){
  currentChatId = chatId;
  history = [];
  renderChatList();
  
  const messagesEl = document.getElementById('messages');
  messagesEl.innerHTML = `<div class="empty" id="empty"><div><h1>What can I help with?</h1><p>Ask Matrix anything.</p></div></div>`;

  try{
    const res = await fetch(`/api/chats/${chatId}/messages`, {
      headers: { 'Authorization': `Bearer ${authToken}` }
    });
    if(res.ok){
      const msgs = await res.json();
      if(msgs.length > 0){
        document.getElementById('empty')?.remove();
        msgs.forEach(m => {
          history.push({ role: m.role, content: m.content });
          appendBubble(m.role, m.content);
        });
      }
    }
  }catch(e){console.error(e);}
}

function appendBubble(role, text){
  const messagesEl = document.getElementById('messages');
  document.getElementById('empty')?.remove();
  const row = document.createElement('div'); row.className = 'row ' + role;
  const bubble = document.createElement('div'); bubble.className = 'bubble'; bubble.textContent = text;
  row.appendChild(bubble); messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return bubble;
}

function escapeHtml(str){
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

async function ask(){
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  const statusEl = document.getElementById('status');
  const text = input.value.trim(); 
  if(!text || busy || !currentChatId) return;

  busy = true; send.disabled = true; input.value = '';
  input.style.height = 'auto';
  statusEl.textContent = 'Thinking…';

  appendBubble('user', text);
  history.push({ role: 'user', content: text });
  const bubble = appendBubble('assistant', '');

  try{
    const r = await fetch(`/api/chats/${currentChatId}/messages`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${authToken}`
      },
      body: JSON.stringify({ messages: history })
    });
    const data = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(data.error || 'Request failed');
    
    bubble.textContent = data.content;
    history.push({ role: 'assistant', content: data.content });

    // Update chat title in sidebar if it changed
    const currentChat = chats.find(c => c._id === currentChatId);
    if(currentChat && data.title){
      currentChat.title = data.title;
      renderChatList();
    }
  }catch(e){
    bubble.textContent = 'Sorry, I could not reach the AI service right now.';
    console.error(e);
  }finally{
    busy = false; send.disabled = false; statusEl.textContent = '';
    input.focus();
    document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
  }
}

document.addEventListener('input', e => {
  if(e.target && e.target.id === 'input'){
    e.target.style.height = 'auto';
    e.target.style.height = Math.min(e.target.scrollHeight, 140) + 'px';
  }
});

document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey && e.target && e.target.id === 'input'){
    e.preventDefault();
    ask();
  }
});

document.addEventListener('click', e => {
  if(e.target && e.target.id === 'send') ask();
});

if(!authToken){
  renderAuth();
}else{
  initApp();
}
</script>
</body>
</html>
